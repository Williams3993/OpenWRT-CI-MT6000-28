# ============================================================
# GL-MT6000 云编译公用核心
#
# 适用于：
#   MT6000-28
#   MT6000-18
#
# 增强：
#   1. 保留原有 feeds / OpenClash（已移除 helloworld / SSR+）
#   2. 本地必须存在 sysupgrade.bin
#   3. sysupgrade.bin 必须大于 1MB
#   4. Release 固定使用 v3.0.3（Node 24 运行时）
#   5. 上传失败直接报错
#   6. Release 创建后再次检查真实附件
#   7. TEST=true 不创建 Release
# ============================================================

name: WRT-CORE

on:
  workflow_call:
    inputs:

      WRT_CONFIG:
        required: true
        type: string

      WRT_THEME:
        required: true
        type: string

      WRT_NAME:
        required: true
        type: string

      WRT_SSID:
        required: true
        type: string

      WRT_WORD:
        required: true
        type: string

      WRT_IP:
        required: true
        type: string

      WRT_PW:
        required: true
        type: string

      WRT_REPO:
        required: true
        type: string

      WRT_BRANCH:
        required: true
        type: string

      WRT_SOURCE:
        required: true
        type: string

      WRT_PACKAGE:
        required: false
        type: string

      WRT_TEST:
        required: false
        type: string


env:

  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}

  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}

  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}


jobs:

  core:

    name: ${{ inputs.WRT_SOURCE }}

    runs-on: ubuntu-24.04

    steps:

      # ========================================================
      # Checkout CI 项目
      # ========================================================

      - name: Checkout Projects
        uses: actions/checkout@main


      # ========================================================
      # 初始化编译环境
      # ========================================================

      - name: Initialization Environment

        env:
          DEBIAN_FRONTEND: noninteractive

        run: |

          # ------------------------------------------------
          # 释放磁盘空间
          #
          # 托管机系统盘预装了 .NET / Android SDK / Haskell / CodeQL
          # 等 OpenWrt 用不到的工具链，占几十 G。分到小盘机器时
          # 剩余空间不够，会报 "No space left on device"
          # （MT6000-18 #95 在第 15 分钟即因此失败），或 Runner 写不了日志
          # 而失联。编译前先删掉。
          # ------------------------------------------------
          echo "清理前磁盘："
          df -h /

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            || true

          sudo docker image prune -af >/dev/null 2>&1 || true

          echo "清理后磁盘："
          df -h /


          sudo -E apt -yqq purge firefox

          sudo -E apt -yqq update

          sudo -E apt -yqq full-upgrade

          sudo -E apt -yqq autoremove --purge

          sudo -E apt -yqq autoclean

          sudo -E apt -yqq clean

          sudo -E apt -yqq install \
            dos2unix \
            libfuse-dev


          sudo bash -c \
            'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'


          sudo -E systemctl daemon-reload

          sudo -E timedatectl set-timezone "Asia/Shanghai"


          sudo mkdir -p /mnt/build_wrt

          sudo chown "$USER":"$USER" /mnt/build_wrt

          sudo ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"


          # ------------------------------------------------
          # 加 swap，防止编译时内存吃满
          #
          # 托管机 4 线程 / 16G 内存，rust、go 大包并行编译时
          # 内存可能被吃光、Runner 进程被饿死，表现为
          # "The hosted runner lost communication with the server"。
          # 剩余空间不足 40G 时不加，避免反过来把磁盘占满。
          # ------------------------------------------------
          SWAP_KB=$(awk '/^SwapTotal:/ {print $2}' /proc/meminfo)
          FREE_KB=$(df -k --output=avail /mnt | tail -n 1)

          if [ "${SWAP_KB:-0}" -lt 7000000 ] && [ "${FREE_KB:-0}" -gt 41943040 ]; then

            sudo swapoff -a || true
            sudo rm -f /mnt/swapfile
            sudo fallocate -l 8G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile

          fi

          free -h
          df -h /mnt


      # ========================================================
      # 初始化变量
      # ========================================================

      - name: Initialization Values

        run: |

          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" \
            >> "$GITHUB_ENV"


          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_INFO=${WRT_SOURCE%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_TARGET=$(grep -m 1 \
            -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' \
            ./Config/$WRT_CONFIG.txt)" \
            >> "$GITHUB_ENV"


          echo "WRT_WIFI=wifi-yes" \
            >> "$GITHUB_ENV"

          echo "WRT_KVER=none" \
            >> "$GITHUB_ENV"

          echo "WRT_LIST=none" \
            >> "$GITHUB_ENV"


      # ========================================================
      # 克隆 ImmortalWrt
      # ========================================================

      - name: Clone Code

        run: |

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/


          cd ./wrt/


          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" \
            >> "$GITHUB_ENV"


          # GitHub Actions 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then

            sed -i \
              '/.cn\//d; /tencent/d; /aliyun/d' \
              "$PROJECT_MIRRORS_FILE"

          fi


      # ========================================================
      # 检查脚本
      # ========================================================

      - name: Check Scripts

        run: |

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex ".*\(txt\|sh\)$" \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;


      # ========================================================
      # Cache
      # ========================================================

      - name: Check Caches

        id: check-cache

        if: env.WRT_TEST != 'true'

        uses: actions/cache@main

        with:

          key: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}

          restore-keys: |
            ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}

          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*


      - name: Update Caches

        if: env.WRT_TEST != 'true'

        run: |

          if [ -d "./wrt/staging_dir" ]; then

            find "./wrt/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" \
              | while read -r DIR; do

                  find "$DIR" \
                    -type f \
                    -exec touch {} +

                done


            mkdir -p ./wrt/tmp

            echo "1" > ./wrt/tmp/.build


            echo "toolchain skiped done!"

          else

            echo "caches missed!"

          fi


      # ========================================================
      # 更新 Feeds
      #
      # 这里保持 MT6000 原来的 feeds
      # openclash 不能删除；helloworld（SSR+）已移除，不再拉取
      # ========================================================

      - name: Update Feeds

        run: |

          cd ./wrt/


          echo "" >> feeds.conf.default


          cat >> feeds.conf.default <<-EOF
          src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;v5
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git openclash https://github.com/vernesong/OpenClash.git
          src-git istore https://github.com/linkease/istore;main
          EOF


          echo "===== feeds.conf.default ====="

          cat feeds.conf.default

          echo "============================="


          ./scripts/feeds update -a


          # 删除源码树自带同名包
          rm -rf ./feeds/luci/applications/luci-app-argon-config

          rm -rf ./feeds/luci/applications/luci-app-openclash

          rm -rf ./feeds/luci/applications/luci-app-passwall

          rm -rf ./feeds/luci/themes/luci-theme-argon

          rm -rf ./feeds/packages/net/mosdns

          rm -rf ./feeds/packages/net/v2ray-geodata


          # 使用 passwall_packages 新版本
          rm -rf ./feeds/packages/net/xray-core

          rm -rf ./feeds/packages/net/sing-box

          rm -rf ./feeds/packages/net/hysteria

          rm -rf ./feeds/packages/net/naiveproxy


          # 新版 xray-core 需要 Go >= 1.27
          rm -rf ./feeds/packages/lang/golang


          git clone \
            --depth 1 \
            -b 27.x \
            https://github.com/sbwml/packages_lang_golang.git \
            ./feeds/packages/lang/golang


          # 删除旧包后重新建立索引
          ./scripts/feeds update -i


          ./scripts/feeds install -a


          # 清理断链
          find ./package/feeds/ \
            -xtype l \
            -exec rm -f {} + \
            2>/dev/null || true


      # ========================================================
      # 自定义 Packages
      # ========================================================

      - name: Custom Packages

        run: |

          cd ./wrt/package/


          "$GITHUB_WORKSPACE/Scripts/Packages.sh"

          "$GITHUB_WORKSPACE/Scripts/Handles.sh"


      # ========================================================
      # 自定义 Files
      # ========================================================

      - name: Custom Files

        run: |

          if [ -d "$GITHUB_WORKSPACE/Files" ]; then

            mkdir -p ./wrt/files


            cp -rf \
              "$GITHUB_WORKSPACE/Files/." \
              ./wrt/files/


            # 只能处理脚本文本
            # 不能对整个 Files 做 dos2unix
            # 避免损坏 OpenClash 内核 / Geo 数据等二进制文件

            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec dos2unix {} \; \
              2>/dev/null || true


            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec chmod +x {} \; \
              2>/dev/null || true


            chmod 755 \
              ./wrt/files/etc/openclash/core/clash_meta \
              2>/dev/null || true


            echo "===== files ====="

            find ./wrt/files/ -type f

            echo "================="

          fi


      # ========================================================
      # 应用配置
      # ========================================================

      - name: Custom Settings

        run: |

          cd ./wrt/


          cat \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" \
            >> .config


          "$GITHUB_WORKSPACE/Scripts/Settings.sh"


          make defconfig -j"$(nproc)"

          make clean -j"$(nproc)"


      # ========================================================
      # 下载 Packages
      # ========================================================

      - name: Download Packages

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/

          make download -j"$(nproc)"


      # ========================================================
      # 编译固件
      # ========================================================

      - name: Compile Firmware

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/


          free -h
          df -h /mnt


          # nice 19：编译让出 CPU，保证 Runner 自身进程不被饿死
          nice -n 19 make -j"$(nproc)" \
            || nice -n 19 make -j"$(nproc)" V=s \
            || nice -n 19 make -j1 V=s


      # ========================================================
      # 清理 Cache
      # ========================================================

      - name: Cleanup Caches

        if: >
          success() &&
          env.WRT_TEST != 'true' &&
          steps.check-cache.outputs.cache-hit != 'true'

        run: |

          CACHE_LIST=$(gh cache list \
            --key "$WRT_CONFIG-$WRT_INFO" \
            | cut -f 1)


          for CACHE_KEY in $CACHE_LIST; do

            gh cache delete "$CACHE_KEY"

          done


          echo "caches cleanup done!"


      # ========================================================
      # 编译机信息
      # ========================================================

      - name: Machine Information

        run: |

          cd ./wrt/


          echo "======================="

          lscpu | grep -E "name|Core|Thread"

          echo "======================="

          df -h

          echo "======================="

          du -h --max-depth=1

          echo "======================="


      # ========================================================
      # 整理固件
      # ========================================================

      - name: Package Firmware

        shell: bash

        run: |

          set -euo pipefail


          cd ./wrt/


          # 防止目录残留
          rm -rf ./upload/

          mkdir -p ./upload/


          # 保存最终配置
          cp -f \
            ./.config \
            ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt


          if [[ "$WRT_TEST" != 'true' ]]; then


            # ==================================================
            # 获取内核版本
            # ==================================================

            WRT_KERNEL_VERSION=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^kernel - \K[\d\.]+' \
                  {} \; \
                | head -n 1

            )


            if [ -n "$WRT_KERNEL_VERSION" ]; then

              echo "WRT_KVER=$WRT_KERNEL_VERSION" \
                >> "$GITHUB_ENV"

            fi


            # ==================================================
            # 获取 LuCI 插件列表
            # ==================================================

            WRT_LUCI_LIST=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^luci-(app|theme)[^ ]*' \
                  {} \; \
                | sort -u \
                | tr '\n' ' '

            )


            if [ -n "$WRT_LUCI_LIST" ]; then

              echo "WRT_LIST=$WRT_LUCI_LIST" \
                >> "$GITHUB_ENV"

            fi


            echo
            echo "=================================================="
            echo "原始编译产物"
            echo "=================================================="


            find ./bin/targets/ \
              -type f \
              -printf '%p    %s bytes\n' \
              | sort


            echo "=================================================="


            # 删除不需要上传的文件
            find ./bin/targets/ \
              -iregex \
              ".*\(buildinfo\|json\|sha256sums\|packages\)$" \
              -exec rm -rf {} +


            # 删除 trusted-firmware-a 顺带产出的通用 ram-boot bl2
            # （mt7981/mt7986/mt7987/mt7988 共 8 个，与 GL-MT6000 刷机无关，
            #   GL-MT6000 自己的 bl2 是 *gl-mt6000-preloader.bin，不受影响）
            find ./bin/targets/ \
              -type f \
              -name "*-ram-*-bl2.bin" \
              -print -delete


            # ==================================================
            # MT6000 目标文件重命名
            # ==================================================

            while IFS= read -r -d '' FILE; do


              [ -f "$FILE" ] || continue


              BASENAME=$(basename "$FILE")


              EXT="${BASENAME#*.}"


              NAME=$(

                echo "$BASENAME" \
                  | grep -io "\($WRT_TARGET\).*" \
                  | cut -d '.' -f 1 \
                  || true

              )


              if [ -z "$NAME" ]; then

                continue

              fi


              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"


              echo
              echo "重命名固件："
              echo
              echo "$BASENAME"
              echo "-> $NEW_FILE"
              echo


              mv -f \
                "$FILE" \
                "./upload/$NEW_FILE"


            done < <(

              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*" \
                -print0

            )


            # 其余文件移动到 upload
            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;


          fi


          echo
          echo "=================================================="
          echo "准备上传的文件"
          echo "=================================================="


          find ./upload/ \
            -maxdepth 1 \
            -type f \
            -printf '%f    %s bytes\n' \
            | sort


          echo "=================================================="


      # ========================================================
      # 验证 GL-MT6000 固件
      #
      # 正常模式必须存在 sysupgrade.bin
      # ========================================================

      - name: Verify Firmware

        if: env.WRT_TEST != 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "=================================================="
          echo "检查 GL-MT6000 固件"
          echo "=================================================="


          if [ ! -d "./wrt/upload" ]; then

            echo "::error::upload 目录不存在！"

            exit 1

          fi


          echo
          echo "upload 目录文件："
          echo


          find ./wrt/upload/ \
            -maxdepth 1 \
            -type f \
            -printf '%f    %s bytes\n' \
            | sort


          echo


          SYSUPGRADE=$(

            find ./wrt/upload/ \
              -maxdepth 1 \
              -type f \
              -iname '*sysupgrade*.bin' \
              -print \
              -quit

          )


          if [ -z "$SYSUPGRADE" ]; then

            echo
            echo "::error::没有找到 GL-MT6000 sysupgrade.bin！"
            echo
            echo "::error::停止创建 GitHub Release。"
            echo

            exit 1

          fi


          SIZE=$(stat -c%s "$SYSUPGRADE")


          if [ "$SIZE" -lt 1048576 ]; then

            echo
            echo "::error::sysupgrade.bin 大小异常：${SIZE} bytes"
            echo

            exit 1

          fi


          echo
          echo "[OK] 找到 GL-MT6000 sysupgrade.bin："
          echo
          echo "$SYSUPGRADE"
          echo
          echo "固件大小：${SIZE} bytes"
          echo
          echo "[OK] 本地固件验证成功"
          echo


      # ========================================================
      # TEST 模式
      #
      # TEST=true：
      # 只检查配置，不创建 Release
      #
      # 避免只有 Config 文件的测试 Release
      # 占掉最新10个正式固件名额
      # ========================================================

      - name: Test Mode Result

        if: env.WRT_TEST == 'true'

        run: |

          echo
          echo "=================================================="
          echo "TEST 模式"
          echo "=================================================="
          echo
          echo "只生成配置文件"
          echo "不编译固件"
          echo "不创建 GitHub Release"
          echo
          echo "=================================================="


      # ========================================================
      # 发布 Release
      # ========================================================

      - name: Release Firmware

        id: release

        if: env.WRT_TEST != 'true'

        continue-on-error: true

        uses: softprops/action-gh-release@v3.0.3

        with:

          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}

          files: ./wrt/upload/*.*

          fail_on_unmatched_files: true

          body: |

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            WIFI名称：${{ env.WRT_SSID }}
            WIFI密码：${{ env.WRT_WORD }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}


      # ========================================================
      # Release 上传重试
      #
      # action-gh-release 并发上传附件，偶发
      # "other side closed" 网络中断会导致整步失败。
      # 首次失败时改用 gh 逐个顺序补传（--clobber 覆盖），
      # 每个文件最多重试 5 次。
      # ========================================================

      - name: Release Firmware Retry

        if: env.WRT_TEST != 'true' && steps.release.outcome == 'failure'

        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -uo pipefail


          TAG="${WRT_CONFIG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}"


          echo "首次上传失败，开始补传：$TAG"

          sleep 30


          # Release 未创建时补建（正文从首次步骤参数无法取回，写简要说明）
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "源码：${WRT_REPO}  分支：${WRT_BRANCH}  配置：${WRT_CONFIG}  内核：${WRT_KVER:-}" \
              || exit 1

          fi


          FAILED=0

          for FILE in ./wrt/upload/*.*; do

            OK=0

            for i in 1 2 3 4 5; do

              if gh release upload "$TAG" "$FILE" \
                   --repo "$GITHUB_REPOSITORY" \
                   --clobber; then

                echo "[OK] $(basename "$FILE")"
                OK=1
                break

              fi

              echo "[RETRY $i] $(basename "$FILE")"
              sleep $((i * 10))

            done

            [ "$OK" -eq 1 ] || FAILED=1

          done


          if [ "$FAILED" -ne 0 ]; then

            echo "::error::Release 附件补传失败"
            exit 1

          fi


      # ========================================================
      # Release 上传后二次验证
      #
      # GitHub 实际附件中必须存在 sysupgrade.bin
      # ========================================================

      - name: Verify Release Upload

        if: env.WRT_TEST != 'true'

        shell: bash

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -euo pipefail


          TAG="${WRT_CONFIG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}"


          echo "=================================================="
          echo "验证 GitHub Release"
          echo "=================================================="


          echo
          echo "Release Tag："
          echo
          echo "$TAG"
          echo


          ASSETS=$(

            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'

          )


          echo
          echo "GitHub Release 中实际存在的附件："
          echo
          echo "$ASSETS"
          echo


          if ! printf '%s\n' "$ASSETS" \
            | grep -qiE 'sysupgrade.*\.bin$'; then

            echo
            echo "::error::GitHub Release 中没有找到 GL-MT6000 sysupgrade.bin！"
            echo
            echo "::error::Release 上传验证失败。"
            echo

            exit 1

          fi


          MISSING=0

          for FILE in ./wrt/upload/*.*; do

            NAME=$(basename "$FILE")

            if ! printf '%s\n' "$ASSETS" | grep -qxF "$NAME"; then

              echo "::error::Release 缺少附件：$NAME"
              MISSING=1

            fi

          done


          if [ "$MISSING" -ne 0 ]; then

            exit 1

          fi


          echo
          echo "[OK] GitHub Release 中确认存在 sysupgrade.bin"
          echo
