# ============================================================
# X86_X64 云编译公用核心
#
# 增强：
#
# 1. 必须生成 combined 磁盘镜像
# 2. 固件镜像必须大于 1MB
# 3. Release 固定到 v2.6.2
# 4. Release 上传后再次检查真实附件
# 5. TEST=true 不创建 Release
# ============================================================

name: WRT-CORE

on:
  workflow_call:
    inputs:

      WRT_CONFIG:
        required: true
        type: string

      WRT_THEME:
        required: true
        type: string

      WRT_NAME:
        required: true
        type: string

      WRT_SSID:
        required: true
        type: string

      WRT_WORD:
        required: true
        type: string

      WRT_IP:
        required: true
        type: string

      WRT_PW:
        required: true
        type: string

      WRT_REPO:
        required: true
        type: string

      WRT_BRANCH:
        required: true
        type: string

      WRT_SOURCE:
        required: true
        type: string

      WRT_PACKAGE:
        required: false
        type: string

      WRT_TEST:
        required: false
        type: string


env:

  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  WRT_CONFIG: ${{ inputs.WRT_CONFIG }}
  WRT_THEME: ${{ inputs.WRT_THEME }}
  WRT_NAME: ${{ inputs.WRT_NAME }}
  WRT_SSID: ${{ inputs.WRT_SSID }}
  WRT_WORD: ${{ inputs.WRT_WORD }}
  WRT_IP: ${{ inputs.WRT_IP }}
  WRT_PW: ${{ inputs.WRT_PW }}

  WRT_REPO: ${{ inputs.WRT_REPO }}
  WRT_BRANCH: ${{ inputs.WRT_BRANCH }}
  WRT_SOURCE: ${{ inputs.WRT_SOURCE }}

  WRT_PACKAGE: ${{ inputs.WRT_PACKAGE }}
  WRT_TEST: ${{ inputs.WRT_TEST }}


jobs:

  core:

    name: ${{ inputs.WRT_SOURCE }}

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Projects
        uses: actions/checkout@main


      - name: Initialization Environment

        env:
          DEBIAN_FRONTEND: noninteractive

        run: |

          sudo -E apt -yqq purge firefox

          sudo -E apt -yqq update

          sudo -E apt -yqq full-upgrade

          sudo -E apt -yqq autoremove --purge

          sudo -E apt -yqq autoclean

          sudo -E apt -yqq clean

          sudo -E apt -yqq install dos2unix libfuse-dev


          sudo bash -c \
            'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'


          sudo -E systemctl daemon-reload

          sudo -E timedatectl set-timezone "Asia/Shanghai"


          sudo mkdir -p /mnt/build_wrt

          sudo chown "$USER":"$USER" /mnt/build_wrt

          sudo ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"


      - name: Initialization Values

        run: |

          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" \
            >> "$GITHUB_ENV"


          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_INFO=${WRT_SOURCE%%/*}" \
            >> "$GITHUB_ENV"


          echo "WRT_TARGET=$(grep -m 1 \
            -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' \
            ./Config/$WRT_CONFIG.txt)" \
            >> "$GITHUB_ENV"


          echo "WRT_WIFI=wifi-yes" \
            >> "$GITHUB_ENV"

          echo "WRT_KVER=none" \
            >> "$GITHUB_ENV"

          echo "WRT_LIST=none" \
            >> "$GITHUB_ENV"


      - name: Clone Code

        run: |

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/


          cd ./wrt/


          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" \
            >> "$GITHUB_ENV"


          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then

            sed -i \
              '/.cn\//d; /tencent/d; /aliyun/d' \
              "$PROJECT_MIRRORS_FILE"

          fi


      - name: Check Scripts

        run: |

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex ".*\(txt\|sh\)$" \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;


      - name: Check Caches

        id: check-cache

        if: env.WRT_TEST != 'true'

        uses: actions/cache@main

        with:

          key: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}

          restore-keys: |
            ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}

          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*


      - name: Update Caches

        if: env.WRT_TEST != 'true'

        run: |

          if [ -d "./wrt/staging_dir" ]; then

            find "./wrt/staging_dir" \
              -type d \
              -name "stamp" \
              -not -path "*target*" \
              | while read -r DIR; do

                  find "$DIR" \
                    -type f \
                    -exec touch {} +

                done


            mkdir -p ./wrt/tmp

            echo "1" > ./wrt/tmp/.build


            echo "toolchain skiped done!"

          else

            echo "caches missed!"

          fi


      - name: Update Feeds

        run: |

          cd ./wrt/


          echo "" >> feeds.conf.default


          cat >> feeds.conf.default <<-EOF
          src-git mosdns https://github.com/sbwml/luci-app-mosdns.git;v5
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          src-git istore https://github.com/linkease/istore;main
          EOF


          echo "===== feeds.conf.default ====="

          cat feeds.conf.default

          echo "============================="


          ./scripts/feeds update -a


          rm -rf ./feeds/luci/applications/luci-app-argon-config

          rm -rf ./feeds/luci/applications/luci-app-passwall

          rm -rf ./feeds/luci/themes/luci-theme-argon

          rm -rf ./feeds/packages/net/mosdns

          rm -rf ./feeds/packages/net/v2ray-geodata


          rm -rf ./feeds/packages/net/xray-core

          rm -rf ./feeds/packages/net/sing-box

          rm -rf ./feeds/packages/net/hysteria

          rm -rf ./feeds/packages/net/naiveproxy


          rm -rf ./feeds/packages/lang/golang


          git clone \
            --depth 1 \
            -b 27.x \
            https://github.com/sbwml/packages_lang_golang.git \
            ./feeds/packages/lang/golang


          ./scripts/feeds update -i

          ./scripts/feeds install -a


          find ./package/feeds/ \
            -xtype l \
            -exec rm -f {} + \
            2>/dev/null || true


      - name: Custom Packages

        run: |

          cd ./wrt/package/

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"

          "$GITHUB_WORKSPACE/Scripts/Handles.sh"


      - name: Custom Files

        run: |

          if [ -d "$GITHUB_WORKSPACE/Files" ]; then

            mkdir -p ./wrt/files

            cp -rf \
              "$GITHUB_WORKSPACE/Files/." \
              ./wrt/files/


            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec dos2unix {} \; \
              2>/dev/null || true


            find ./wrt/files/etc/uci-defaults/ \
              -type f \
              -exec chmod +x {} \; \
              2>/dev/null || true


            echo "===== files ====="

            find ./wrt/files/ -type f

            echo "================="

          fi


      - name: Custom Settings

        run: |

          cd ./wrt/


          cat \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" \
            >> .config


          "$GITHUB_WORKSPACE/Scripts/Settings.sh"


          make defconfig -j"$(nproc)"

          make clean -j"$(nproc)"


      - name: Download Packages

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/

          make download -j"$(nproc)"


      - name: Compile Firmware

        if: env.WRT_TEST != 'true'

        run: |

          cd ./wrt/


          make -j"$(nproc)" \
            || make -j"$(nproc)" V=s \
            || make -j1 V=s


      - name: Cleanup Caches

        if: >
          success() &&
          env.WRT_TEST != 'true' &&
          steps.check-cache.outputs.cache-hit != 'true'

        run: |

          CACHE_LIST=$(gh cache list \
            --key "$WRT_CONFIG-$WRT_INFO" \
            | cut -f 1)


          for CACHE_KEY in $CACHE_LIST; do

            gh cache delete "$CACHE_KEY"

          done


          echo "caches cleanup done!"


      - name: Machine Information

        run: |

          cd ./wrt/


          echo "======================="

          lscpu | grep -E "name|Core|Thread"

          echo "======================="

          df -h

          echo "======================="

          du -h --max-depth=1

          echo "======================="


      - name: Package Firmware

        shell: bash

        run: |

          set -euo pipefail


          cd ./wrt/


          rm -rf ./upload/

          mkdir -p ./upload/


          cp -f \
            ./.config \
            ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt


          if [[ "$WRT_TEST" != 'true' ]]; then


            WRT_KERNEL_VERSION=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^kernel - \K[\d\.]+' \
                  {} \; \
                | head -n 1

            )


            if [ -n "$WRT_KERNEL_VERSION" ]; then

              echo "WRT_KVER=$WRT_KERNEL_VERSION" \
                >> "$GITHUB_ENV"

            fi


            WRT_LUCI_LIST=$(

              find ./bin/targets/ \
                -type f \
                -name "*.manifest" \
                -exec grep -oP \
                  '^luci-(app|theme)[^ ]*' \
                  {} \; \
                | sort -u \
                | tr '\n' ' '

            )


            if [ -n "$WRT_LUCI_LIST" ]; then

              echo "WRT_LIST=$WRT_LUCI_LIST" \
                >> "$GITHUB_ENV"

            fi


            echo
            echo "=================================================="
            echo "原始编译产物"
            echo "=================================================="


            find ./bin/targets/ \
              -type f \
              -printf '%p    %s bytes\n' \
              | sort


            echo "=================================================="


            find ./bin/targets/ \
              -iregex \
              ".*\(buildinfo\|json\|sha256sums\|packages\)$" \
              -exec rm -rf {} +


            while IFS= read -r FILE; do


              [ -f "$FILE" ] || continue


              BASENAME=$(basename "$FILE")

              EXT="${BASENAME#*.}"


              NAME=$(

                echo "$BASENAME" \
                  | grep -io "\($WRT_TARGET\).*" \
                  | cut -d '.' -f 1 \
                  || true

              )


              if [ -z "$NAME" ]; then

                continue

              fi


              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"


              echo
              echo "重命名固件："
              echo "$BASENAME"
              echo "-> $NEW_FILE"


              mv -f \
                "$FILE" \
                "./upload/$NEW_FILE"


            done < <(

              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*"

            )


            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;


          fi


          echo
          echo "=================================================="
          echo "准备上传的文件"
          echo "=================================================="


          find ./upload/ \
            -maxdepth 1 \
            -type f \
            -printf '%f    %s bytes\n' \
            | sort


          echo "=================================================="


      # ========================================================
      # X86 固件验证
      #
      # X86 没有 sysupgrade.bin
      #
      # 必须至少存在：
      #
      # combined*.img
      #
      # 或：
      #
      # combined*.img.gz
      # ========================================================

      - name: Verify Firmware

        if: env.WRT_TEST != 'true'

        shell: bash

        run: |

          set -euo pipefail


          echo "=================================================="
          echo "检查 X86_X64 固件"
          echo "=================================================="


          if [ ! -d "./wrt/upload" ]; then

            echo "::error::upload 目录不存在！"

            exit 1

          fi


          find ./wrt/upload/ \
            -maxdepth 1 \
            -type f \
            -printf '%f    %s bytes\n' \
            | sort


          IMAGE=$(

            find ./wrt/upload/ \
              -maxdepth 1 \
              -type f \
              \( \
                -iname '*combined*.img' \
                -o \
                -iname '*combined*.img.gz' \
              \) \
              -print \
              -quit

          )


          if [ -z "$IMAGE" ]; then

            echo
            echo "::error::没有找到 X86 combined 磁盘镜像！"
            echo
            echo "::error::停止创建 GitHub Release。"
            echo

            exit 1

          fi


          SIZE=$(stat -c%s "$IMAGE")


          if [ "$SIZE" -lt 1048576 ]; then

            echo
            echo "::error::X86 固件镜像大小异常：${SIZE} bytes"
            echo

            exit 1

          fi


          echo
          echo "[OK] 找到 X86 固件镜像："
          echo
          echo "$IMAGE"
          echo
          echo "固件大小：${SIZE} bytes"
          echo
          echo "[OK] X86 固件检查通过"


      - name: Test Mode Result

        if: env.WRT_TEST == 'true'

        run: |

          echo
          echo "=================================================="
          echo "TEST 模式"
          echo "=================================================="
          echo
          echo "只生成配置"
          echo "不创建 GitHub Release"
          echo
          echo "=================================================="


      - name: Release Firmware

        if: env.WRT_TEST != 'true'

        uses: softprops/action-gh-release@v2.6.2

        with:

          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}

          files: ./wrt/upload/*.*

          fail_on_unmatched_files: true

          body: |

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}


      - name: Verify Release Upload

        if: env.WRT_TEST != 'true'

        shell: bash

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -euo pipefail


          TAG="${WRT_CONFIG}-${WRT_INFO}-${WRT_BRANCH}-${WRT_DATE}"


          echo "=================================================="
          echo "验证 GitHub Release"
          echo "=================================================="


          ASSETS=$(

            gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'

          )


          echo
          echo "GitHub Release 中实际存在的附件："
          echo
          echo "$ASSETS"
          echo


          if ! echo "$ASSETS" \
            | grep -qiE 'combined.*\.img(\.gz)?$'; then


            echo
            echo "::error::GitHub Release 中没有找到 X86 combined 镜像！"
            echo
            echo "::error::Release 上传验证失败。"
            echo

            exit 1

          fi


          echo
          echo "[OK] GitHub Release 中确认存在 X86 combined 镜像"
          echo
          echo "[OK] X86_X64 固件发布验证成功"
          echo
          echo "=================================================="
